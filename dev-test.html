<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FC Manager - Engine Tests</title>
<style>
  body { background:#0e1117; color:#dfe6f0; font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; padding:20px; }
  h2 { color:#4ade80; font-size:14px; margin:22px 0 8px; border-bottom:1px solid #263041; padding-bottom:5px; }
  .ok { color:#4ade80; } .bad { color:#f87171; } .warn { color:#fbbf24; } .dim { color:#7b8797; }
  pre { margin:3px 0; white-space:pre-wrap; }
</style>
</head>
<body>
<div id="out">Running…</div>

<script>
// Cache-bust every module so edits are always picked up on reload.
(function () {
  var v = '?v=' + Date.now();
  ['js/core/version.js', 'js/core/settings.js', 'js/core/tags.js', 'js/core/rng.js',
   'js/core/util.js', 'js/core/names.js',
   'js/engine/player.js', 'js/engine/tactics.js', 'js/engine/match.js',
   'js/engine/youth.js', 'js/engine/finance.js', 'js/engine/morale.js',
   'js/engine/manmgmt.js', 'js/engine/nations.js',
   'js/engine/international.js',
   'js/data/db-clubs.js', 'js/data/db-nations.js', 'js/data/db-names.js',
   'js/data/db-players.js', 'js/data/db-intl.js', 'js/engine/db.js']
    .forEach(function (f) { document.write('<script src="' + f + v + '"><\/script>'); });
})();
</script>
<script>
const out = document.getElementById('out');
out.innerHTML = '';
function log(s, cls) {
  const p = document.createElement('pre');
  if (cls) p.className = cls;
  p.textContent = s;
  out.appendChild(p);
}
function h2(s) { const e = document.createElement('h2'); e.textContent = s; out.appendChild(e); }
let fails = 0;
function assert(cond, label, detail) {
  if (cond) log('  PASS  ' + label + (detail ? '   ' + detail : ''), 'ok');
  else { fails++; log('  FAIL  ' + label + (detail ? '   ' + detail : ''), 'bad'); }
}

const U = FCM.U, P = FCM.P, T = FCM.T, M = FCM.M;

try {
// ---------------------------------------------------------------- data
h2('1. Data integrity');
const rng = new FCM.RNG(12345);
const t0 = performance.now();
const DB = FCM.DB.build(rng, 2025);
const buildMs = performance.now() - t0;
log(`  built in ${buildMs.toFixed(0)}ms`, 'dim');
assert(DB.players.length > 10000, 'players loaded', DB.players.length);
assert(DB.clubs.length === 400, 'clubs loaded', DB.clubs.length);
assert(DB.leagues.length === 22, 'leagues loaded', DB.leagues.length);
assert(buildMs < 3000, 'build under 3s', buildMs.toFixed(0) + 'ms');

const salah = DB.players.find(p => p.name === 'M. Salah');
assert(salah && salah.ovr === 91, 'Salah is 91 rated', salah ? 'ovr=' + salah.ovr : 'missing');
assert(salah && salah.value > 50e6, 'Salah value realistic', salah ? U.money(salah.value) : '');

const empties = DB.clubs.filter(c => c.squad.length < 11);
assert(empties.length === 0, 'every club has 11+ players',
  empties.length ? empties.slice(0,3).map(c=>c.name+':'+c.squad.length).join(', ') : 'all ok');

const badPos = DB.players.filter(p => !p.pos.length);
assert(badPos.length === 0, 'every player has a position', badPos.length + ' bad');

// value anchoring should reproduce real values closely
let anchorErr = 0, n = 0;
DB.players.forEach(p => {
  if (p.value > 0) { const before = p.value; P.recalcValue(p); anchorErr += Math.abs(p.value-before)/before; n++; }
});
assert(anchorErr/n < 0.25, 'value model reproduces real values', 'mean drift ' + ((anchorErr/n)*100).toFixed(1) + '%');

// ------------------------------------------------------------ tactics
h2('2. Tactics & line-up selection');
const liv = DB.clubs.find(c => c.name === 'Liverpool');
const bur = DB.clubs.find(c => c.name === 'Burnley');
assert(!!liv && !!bur, 'test clubs found');

let formationsOk = true, formationDetail = '';
T.FORMATION_NAMES.forEach(f => {
  if (T.FORMATIONS[f].length !== 11) { formationsOk = false; formationDetail += f + '=' + T.FORMATIONS[f].length + ' '; }
  const gks = T.FORMATIONS[f].filter(s => s.pos === 'GK').length;
  if (gks !== 1) { formationsOk = false; formationDetail += f + ' gk=' + gks + ' '; }
});
assert(formationsOk, T.FORMATION_NAMES.length + ' formations have 11 slots & 1 GK', formationDetail);

const livSquad = FCM.DB.squadOf(liv);
const picked = T.autoPick(livSquad, '4-3-3');
assert(picked.lineup.filter(Boolean).length === 11, 'auto-pick fills 11', picked.lineup.filter(Boolean).length);
assert(new Set(picked.lineup).size === 11, 'no duplicate players in XI');
const pickedGK = FCM.DB.byId[picked.lineup[0]];
assert(pickedGK && pickedGK.pos[0] === 'GK', 'a real keeper starts in goal', pickedGK ? pickedGK.name+' ('+pickedGK.pos.join(',')+')' : '');
assert(picked.subs.length >= 7, 'bench filled', picked.subs.length);
assert(picked.subs.some(id => FCM.DB.byId[id].pos[0] === 'GK'), 'backup keeper on bench');

const xi = picked.lineup.map(id => FCM.DB.byId[id]);
log('  Liverpool 4-3-3: ' + T.FORMATIONS['4-3-3'].map((s,i)=>s.pos+' '+xi[i].name).join(', '), 'dim');
const tac = T.defaultTactics(); tac.formation='4-3-3'; tac.lineup=picked.lineup; tac.subs=picked.subs;
log('  XI strength: ' + T.lineupStrength(tac, FCM.DB.byId), 'dim');

// out-of-position penalty sanity
const cb = livSquad.find(p => p.pos[0] === 'CB');
assert(P.overallAt(cb,'CB') > P.overallAt(cb,'ST'), 'CB worse as ST',
  cb.name + ' CB=' + P.overallAt(cb,'CB') + ' ST=' + P.overallAt(cb,'ST'));

// ------------------------------------------------------------- match
h2('3. Match engine (2000 sims: Liverpool vs Burnley)');
function mkTactics(club, form) {
  const sq = FCM.DB.squadOf(club);
  const pk = T.autoPick(sq, form);
  const t = T.defaultTactics();
  t.formation = form; t.lineup = pk.lineup; t.subs = pk.subs;
  return t;
}
const hT = mkTactics(liv,'4-3-3'), aT = mkTactics(bur,'4-4-2');

let hg=0, ag=0, hw=0, d=0, aw=0, shots=0, ot=0, yellows=0, reds=0, games=2000;
const scoreline = {};
const mt0 = performance.now();
for (let i=0;i<games;i++) {
  const r = M.play(liv,bur,hT,aT,FCM.DB.byId,{rng:new FCM.RNG(i*7+1)});
  hg+=r.homeGoals; ag+=r.awayGoals; shots+=r.stats.shots[0]+r.stats.shots[1];
  ot+=r.stats.onTarget[0]+r.stats.onTarget[1];
  r.events.forEach(e=>{ if(e.type==='yellow')yellows++; if(e.type==='red')reds++; });
  if (r.homeGoals>r.awayGoals) hw++; else if (r.homeGoals===r.awayGoals) d++; else aw++;
  const k = r.homeGoals+'-'+r.awayGoals; scoreline[k]=(scoreline[k]||0)+1;
}
const simMs = performance.now()-mt0;
const gpg = (hg+ag)/games;
log(`  ${games} matches in ${simMs.toFixed(0)}ms  (${(simMs/games).toFixed(2)}ms each)`, 'dim');
log(`  Liverpool ${(hg/games).toFixed(2)} - ${(ag/games).toFixed(2)} Burnley   W${hw} D${d} L${aw}`, 'dim');
log('  common scores: ' + Object.entries(scoreline).sort((a,b)=>b[1]-a[1]).slice(0,6)
     .map(([k,v])=>k+' ('+(v/games*100).toFixed(0)+'%)').join('  '), 'dim');

assert(gpg > 2.0 && gpg < 4.2, 'goals per game realistic', gpg.toFixed(2));
assert(hw/games > 0.45 && hw/games < 0.88, 'favourite wins often but not always', (hw/games*100).toFixed(0)+'%');
assert(d/games > 0.06, 'draws happen', (d/games*100).toFixed(0)+'%');
assert(aw/games > 0.02, 'upsets happen', (aw/games*100).toFixed(0)+'%');
const shotsPg = shots/games/2, otPg = ot/games/2;
assert(shotsPg>6 && shotsPg<22, 'shots per team per game', shotsPg.toFixed(1));
assert(otPg>2 && otPg<9, 'shots on target per team', otPg.toFixed(1));
assert(yellows/games>1.0 && yellows/games<7, 'yellows per game', (yellows/games).toFixed(2));
assert(reds/games<0.35, 'reds are rare', (reds/games).toFixed(3));
assert(simMs/games < 12, 'sim fast enough for full seasons', (simMs/games).toFixed(2)+'ms');

// even match should be near 50/50
h2('4. Match engine balance (evenly matched sides)');
const ars = DB.clubs.find(c=>c.name==='Arsenal'), mci = DB.clubs.find(c=>c.name==='Manchester City');
const aT2 = mkTactics(ars,'4-3-3'), mT2 = mkTactics(mci,'4-3-3');
let h2w=0,h2d=0,h2l=0,h2g=0,a2g=0;
for (let i=0;i<1500;i++){
  const r=M.play(ars,mci,aT2,mT2,FCM.DB.byId,{rng:new FCM.RNG(i*13+5)});
  h2g+=r.homeGoals; a2g+=r.awayGoals;
  if(r.homeGoals>r.awayGoals)h2w++; else if(r.homeGoals===r.awayGoals)h2d++; else h2l++;
}
log(`  Arsenal ${(h2g/1500).toFixed(2)} - ${(a2g/1500).toFixed(2)} Man City   W${h2w} D${h2d} L${h2l}`, 'dim');
assert(h2w>h2l, 'home advantage exists', `${h2w} vs ${h2l}`);
assert(h2w/1500 < 0.62, 'home advantage not overwhelming', (h2w/1500*100).toFixed(0)+'%');

// ratings & events consistency
h2('5. Ratings, events & stat consistency');
const r1 = M.play(liv,bur,hT,aT,FCM.DB.byId,{rng:new FCM.RNG(99)});
assert(r1.homeRatings.length>=11 && r1.awayRatings.length>=11, 'all players rated',
  r1.homeRatings.length+'/'+r1.awayRatings.length);
const allR = r1.homeRatings.concat(r1.awayRatings);
assert(allR.every(x=>x.rating>=3 && x.rating<=10), 'ratings in range');
const goalEvents = r1.events.filter(e=>e.type==='goal').length;
assert(goalEvents === r1.homeGoals+r1.awayGoals, 'goal events match scoreline',
  goalEvents+' events vs '+(r1.homeGoals+r1.awayGoals)+' goals');
const sumGoals = allR.reduce((s,x)=>s+x.goals,0);
assert(sumGoals === r1.homeGoals+r1.awayGoals, 'player goals sum to scoreline', sumGoals);
assert(!!r1.motm, 'man of the match chosen');
assert(r1.stats.possession[0]+r1.stats.possession[1]===100, 'possession sums to 100',
  r1.stats.possession.join('/'));

// scorers should skew to forwards
let fwd=0, tot=0;
for(let i=0;i<400;i++){
  const r=M.play(liv,bur,hT,aT,FCM.DB.byId,{rng:new FCM.RNG(i*3+77)});
  r.homeRatings.concat(r.awayRatings).forEach(x=>{
    if(x.goals>0){ tot+=x.goals; if(P.GROUP[x.pos]==='ATT'||x.pos==='CAM') fwd+=x.goals; }
  });
}
assert(fwd/tot > 0.45, 'forwards score most goals', (fwd/tot*100).toFixed(0)+'%');

// penalties
h2('6. Penalty shoot-outs');
let pens=0, draws2=0;
for(let i=0;i<300;i++){
  const r=M.penalties(hT,aT,FCM.DB.byId,new FCM.RNG(i+1));
  if(r.home===r.away) draws2++;
  pens+=r.home+r.away;
}
assert(draws2===0, 'shoot-outs always produce a winner', draws2+' draws');
assert(pens/300 > 4 && pens/300 < 14, 'penalty conversion sane', (pens/300).toFixed(1)+' scored per tie');

// ------------------------------------------------------- development
h2('7. Player development over a season');
const wonder = DB.players.filter(p=>p.age<=19 && p.pot-p.ovr>=12).sort((a,b)=>b.pot-a.pot)[0];
const before = wonder.ovr, beforeVal = wonder.value;
for(let w=0; w<40; w++){
  P.develop(wonder,{minutesShare:0.85,facilities:5,coaching:5,avgRating:7.2,rng:rng});
}
log(`  ${wonder.name} (${wonder.age}, pot ${wonder.pot}): ${before} -> ${wonder.ovr} ovr, ` +
    `${U.money(beforeVal)} -> ${U.money(wonder.value)}`, 'dim');
assert(wonder.ovr>before, 'wonderkid improves with games+facilities', before+' -> '+wonder.ovr);
assert(wonder.ovr<=wonder.pot, 'never exceeds potential');
assert(wonder.value>beforeVal, 'value rises with rating');

const benched = DB.players.filter(p=>p.age<=19 && p.pot-p.ovr>=12 && p.id!==wonder.id)[0];
const bBefore = benched.ovr;
for(let w=0;w<40;w++) P.develop(benched,{minutesShare:0.02,facilities:1,coaching:1,avgRating:6.0,rng:rng});
log(`  ${benched.name} (${benched.age}) rotting in the reserves: ${bBefore} -> ${benched.ovr}`, 'dim');
assert(benched.ovr-bBefore < wonder.ovr-before, 'game time matters for growth',
  `+${benched.ovr-bBefore} vs +${wonder.ovr-before}`);

const vet = DB.players.filter(p=>p.age>=34 && p.ovr>=78 && (p.att.pac||0)>80)[0];
if (vet) {
  const vBefore=vet.ovr, vPac=vet.att.pac;
  for(let w=0;w<40;w++) P.develop(vet,{minutesShare:0.8,facilities:5,coaching:5,avgRating:7,rng:rng});
  log(`  ${vet.name} (${vet.age}) ageing: ovr ${vBefore} -> ${vet.ovr}, pace ${vPac} -> ${vet.att.pac}`, 'dim');
  assert(vet.ovr<=vBefore, 'veterans decline', vBefore+' -> '+vet.ovr);
}

// ------------------------------------------- attribute/overall coherence
h2('8. Ratings match attributes');
// A player's card must never disagree with his stats - the classic symptom
// is an 84-rated player whose best attribute is 78.
function impliedErr(p) { return P.computeOverall(p) - p.ovr; }

const realOutfield = DB.players.filter(p => !p.isNewgen && p.pos[0] !== 'GK');
const realErrs = realOutfield.map(p => Math.abs(impliedErr(p)));
log(`  real FC26 players: mean |error| ${U.mean(realErrs).toFixed(2)}, ` +
    `${Math.round(realErrs.filter(e=>e<=6).length/realErrs.length*100)}% within 6`, 'dim');
assert(U.mean(realErrs) < 4, 'real players: attributes match their rating',
  U.mean(realErrs).toFixed(2));

// Generated players, at birth and after a full career of growth.
const yrng = new FCM.RNG(4242);
const yused = new Set();
const anyClub = DB.clubs.find(c => c.name === 'Liverpool') || DB.clubs[0];
const babies = [];
for (let i = 0; i < 300; i++) babies.push(FCM.Y.generateProspect(anyClub, yrng, 2025, yused, 'England'));
const birthErrs = babies.map(p => Math.abs(impliedErr(p)));
assert(Math.max.apply(null, birthErrs) < 5, 'newgens are coherent at birth',
  'worst ' + Math.max.apply(null, birthErrs).toFixed(1));

let worstGrown = 0, worstLabel = '';
['ST','CAM','CM','CB','RB','LW','CDM','GK'].forEach(pos => {
  const p = babies.find(x => x.pos[0] === pos);
  if (!p) return;
  p.pot = 90;
  while (p.ovr < 90) { P.applyAttributeDrift(p, 1, yrng); p.ovr++; }
  const e = Math.abs(impliedErr(p));
  if (e > worstGrown) { worstGrown = e; worstLabel = pos + ' ' + p.ovr + '/' + Math.round(P.computeOverall(p)); }
});
assert(worstGrown < 6, 'newgens stay coherent after growing to 90',
  'worst ' + worstGrown.toFixed(1) + ' (' + worstLabel + ')');

// And the profile has to look like the position he plays.
const grownCB = babies.find(x => x.pos[0] === 'CB');
const grownST = babies.find(x => x.pos[0] === 'ST');
if (grownCB) {
  log(`  grown CB: PAC${grownCB.att.pac} SHO${grownCB.att.sho} PAS${grownCB.att.pas} ` +
      `DRI${grownCB.att.dri} DEF${grownCB.att.def} PHY${grownCB.att.phy}`, 'dim');
  assert(grownCB.att.def > grownCB.att.sho + 20, 'a centre-back defends far better than he shoots',
    'DEF ' + grownCB.att.def + ' vs SHO ' + grownCB.att.sho);
}
if (grownST) {
  log(`  grown ST: PAC${grownST.att.pac} SHO${grownST.att.sho} PAS${grownST.att.pas} ` +
      `DRI${grownST.att.dri} DEF${grownST.att.def} PHY${grownST.att.phy}`, 'dim');
  assert(grownST.att.sho > grownST.att.def, 'a striker shoots better than he defends',
    'SHO ' + grownST.att.sho + ' vs DEF ' + grownST.att.def);
}
// No attribute should run away past a sensible ceiling for the role.
const runaway = babies.filter(p => {
  const w = P.weightsFor(p);
  return Object.keys(p.att).some(k =>
    p.att[k] > 0 && w[k] === undefined && p.att[k] > p.ovr + 10);
});
assert(runaway.length === 0, 'irrelevant attributes never balloon past the rating',
  runaway.length + ' offenders');

// wage demands
h2('9. Valuation & wage demands');
const star = DB.players.find(p=>p.name==='E. Haaland');
if (star) {
  const dem = P.wageDemand(star, 91);
  log(`  ${star.name}: value ${U.money(star.value)}, current wage ${U.wage(star.wage)}, ` +
      `demands ${U.wage(dem)}`, 'dim');
  assert(dem > 100000, 'elite player demands elite wages', U.money(dem));
}
const kid = DB.players.filter(p=>p.age<=18 && p.ovr<62)[0];
if (kid) {
  const dem = P.wageDemand(kid, 40);
  assert(dem < 20000, 'young low-rated player is cheap', U.wage(dem));
}

// ------------------------------------------------- international tournaments
h2('10. International tournaments');
const IN = FCM.IN;
const wc = IN.tournamentsFor(2025).find(t => t.id === 'worldcup') ||
           IN.tournamentsFor(2026).find(t => t.id === 'worldcup');
if (wc) {
  const built = IN.createTournament(wc, new FCM.RNG(99), 'England');
  assert(!!built && built.teams.length === 64, 'World Cup fields 64 nations',
    built ? built.teams.length : 'null');

  // Every nation plays exactly once per matchday. Slicing a flat fixture
  // list into thirds used to make whole groups play all three on one day.
  const seenOn = {};
  let doubleBooked = 0;
  built.fixtures.forEach(f => {
    seenOn[f.day] = seenOn[f.day] || {};
    [f.home, f.away].forEach(n => {
      if (seenOn[f.day][n]) doubleBooked++;
      seenOn[f.day][n] = 1;
    });
  });
  const mdays = Object.keys(seenOn).map(Number).sort((a, b) => a - b);
  log('  group matchdays ' + mdays.join(', ') + ' · ' +
      mdays.map(d => Object.keys(seenOn[d]).length).join('/') + ' nations each', 'dim');
  assert(doubleBooked === 0, 'nobody is down to play twice in a day', doubleBooked);
  assert(mdays.length === 3, 'group stage runs over three matchdays', mdays.length);
  assert(mdays.every(d => Object.keys(seenOn[d]).length === 64),
    'all 64 nations play on every matchday');

  // The whole thing has to finish inside the summer window.
  const trng = new FCM.RNG(7);
  let day = IN.FIRST_DAY, guard = 0;
  while (!built.complete && guard++ < 120) { IN.tick(built, day, trng); day++; }
  assert(built.complete, 'tournament completes', 'day ' + day);
  assert(day <= 364, 'finishes before the season rolls over', 'day ' + day);
  assert(!!built.winner && !!built.runnerUp, 'produces a winner and runner-up',
    built.winner + ' beat ' + built.runnerUp);
  assert(built.knockout.rounds.length === 5, 'full 64-team bracket',
    built.knockout.rounds.map(r => r.name).join(' > '));
}

// A weakened national XI must actually cost you strength.
// game.js is not loaded here, so stand in a minimal state for the lookup.
const realG = FCM.G;
FCM.G = { state: { tactics: {} } };
const engPool = IN.callUpSquad('England', 26) || [];
if (engPool.length >= 20) {
  const base = IN.nationStrength('England');
  const bestPick = T.autoPick(engPool, '4-3-3');
  FCM.G.state.tactics['nation:England'] = Object.assign(T.defaultTactics(),
    { formation: '4-3-3', lineup: bestPick.lineup, subs: bestPick.subs });
  const strong = IN.selectedStrength('England');
  const weakest = U.sortBy(engPool, p => p.ovr, false).slice(0, 11).map(p => p.id);
  FCM.G.state.tactics['nation:England'].lineup = weakest;
  const weak = IN.selectedStrength('England');
  log(`  England: default ${base.toFixed(1)}, best XI ${strong.toFixed(1)}, ` +
      `worst XI ${weak.toFixed(1)}`, 'dim');
  assert(Math.abs(strong - base) < 0.5, 'naming your best XI is neutral',
    strong.toFixed(1) + ' vs ' + base.toFixed(1));
  assert(weak < strong - 3, 'a weakened XI is punished',
    (strong - weak).toFixed(1) + ' weaker');
}
FCM.G = realG;

// ------------------------------------------------------------ money format
h2('11. Money formatting');
FCM.ST.set('fullMoney', false);
assert(U.money(10228900) === '£10.2M', 'abbreviated by default', U.money(10228900));
assert(U.moneyFull(10228900) === '£10,228,900', 'moneyFull groups every 3 digits',
  U.moneyFull(10228900));
assert(U.moneyFull(-4500000) === '-£4,500,000', 'negatives keep the sign',
  U.moneyFull(-4500000));
FCM.ST.set('fullMoney', true);
assert(U.money(10228900) === '£10,228,900', 'toggle switches money everywhere',
  U.money(10228900));
assert(U.money(10228900, { short: true }) === '£10.2M', 'short opts out of full',
  U.money(10228900, { short: true }));
FCM.ST.set('fullMoney', false);

// ---------------------------------------------------------- stadium builds
h2('12. Stadium expansion');
const sc = DB.clubs.find(c => c.capacity > 30000);
const proj = FCM.F.startExpansion(sc, 10000, 300);
// Tracked in weeks, because the day counter resets every season - an
// absolute completion day past 364 would never arrive.
let weeks = 0;
while (!FCM.F.advanceExpansion(proj) && weeks++ < 100) {}
assert(proj.weeksLeft === 0, 'build finishes', weeks + ' weeks');
assert(weeks < 60, 'inside a couple of seasons', weeks);
assert(FCM.F.expansionProgress(proj) === 1, 'progress reaches 100%');

// --------------------------------------------------- national team coverage
h2('13. National team coverage');
const NT = FCM.NT;
NT.fillPools(new FCM.RNG(2024), 2025, new Set());

const natCounts = {};
DB.players.forEach(p => { if (!p.isYouth) natCounts[p.nat] = (natCounts[p.nat] || 0) + 1; });
const thin = NT.all().filter(n => (natCounts[n.name] || 0) < NT.MIN_POOL);
log(`  ${NT.all().length} nations, ${DB.players.length} players`, 'dim');
assert(thin.length === 0, 'every nation can name a legal 26-man squad',
  thin.length ? thin.slice(0, 5).map(n => n.name + ':' + (natCounts[n.name] || 0)).join(', ')
    : 'all ' + NT.all().length);

// Nation names must match the player data's own spelling, or a nation is
// simply invisible - this is how Türkiye and Côte d'Ivoire went missing.
const realNats = {};
DB.players.forEach(p => { realNats[p.nat] = 1; });
const orphanNats = Object.keys(realNats).filter(n => !NT.get(n));
assert(orphanNats.length === 0, 'every nationality in the data maps to a nation',
  orphanNats.slice(0, 6).join(', ') || 'none');
['Türkiye', "Côte d'Ivoire", 'Czechia', 'Congo DR'].forEach(n => {
  assert((natCounts[n] || 0) >= 26, n + ' has a full squad', natCounts[n] || 0);
});

// Every tournament must be able to fill its field.
[2025, 2026, 2027].forEach(season => {
  IN.tournamentsFor(season).forEach(t => {
    const got = IN.qualifiers(t).length;
    assert(got === t.teams, t.name + ' fills its field', got + '/' + t.teams);
  });
});

// A nation's pool must not spill into the transfer market.
const leaked = DB.players.filter(p => p.abroad && p.clubId);
assert(leaked.length === 0, 'players abroad never join a modelled club', leaked.length);

// Scouting must reach the whole world, and cost should track quality.
const regions = FCM.Y.SCOUT_REGIONS;
assert(regions.length === NT.all().length, 'every nation is scoutable', regions.length);
const br = regions.find(r => r.country === 'Brazil');
const sm = regions.find(r => r.country === 'San Marino');
assert(br && sm && br.cost > sm.cost * 3, 'scouting a powerhouse costs more',
  U.money(br.cost) + ' vs ' + U.money(sm.cost));

// Generated players should read as locals, not as generic Europeans.
const names = {};
['Oman', 'Vietnam', 'Japan', 'Georgia'].forEach(n => {
  names[n] = (IN.callUpSquad(n, 4) || []).map(p => p.name).join(', ');
  log(`  ${n}: ${names[n]}`, 'dim');
});
assert(Object.values(names).every(v => v.length > 4), 'thin nations still field named players');

// ------------------------------------------------------ qualifying campaigns
h2('14. Qualifying campaigns');
FCM.G = FCM.G || {};
FCM.G.state = { tactics: {} };
[2025, 2026].forEach(season => {
  IN.tournamentsFor(season).forEach(t => {
    const q = IN.createQualifying(t, new FCM.RNG(11), null);
    if (!q) { assert(false, t.name + ' draws a campaign', 'null'); return; }

    // Places must add up to the field exactly. Rounding each confederation's
    // share independently handed out 84 places at a 64-team World Cup.
    const places = q.campaigns.reduce((a, c) => a + c.places, 0);
    assert(places === t.teams, t.name + ' qualifying plays for exactly its field',
      places + '/' + t.teams);

    // A group must never have to produce more qualifiers than it has teams.
    const impossible = q.campaigns.filter(c =>
      c.places > c.groups.reduce((a, g) => a + g.teams.length, 0));
    assert(impossible.length === 0, t.name + ': every confederation can fill its places',
      impossible.map(c => c.confed).join(', ') || 'ok');

    // Nobody plays twice on the same day.
    let clashes = 0;
    q.campaigns.forEach(c => {
      const seen = {};
      c.fixtures.forEach(f => {
        seen[f.day] = seen[f.day] || {};
        [f.home, f.away].forEach(n => {
          if (seen[f.day][n]) clashes++;
          seen[f.day][n] = 1;
        });
      });
    });
    assert(clashes === 0, t.name + ': no nation is double-booked at a break', clashes);

    // Every fixture must fall on a real international break.
    const offBreak = [];
    q.campaigns.forEach(c => c.fixtures.forEach(f => {
      if (IN.BREAK_DAYS.indexOf(f.day) < 0) offBreak.push(f.day);
    }));
    assert(offBreak.length === 0, t.name + ': qualifiers only at international breaks',
      offBreak.slice(0, 3).join(',') || 'ok');

    // Play it out and check the field comes out the right size.
    const qrng = new FCM.RNG(3);
    IN.BREAK_DAYS.forEach(d => IN.tickQualifying(q, d, qrng));
    IN.finaliseQualifying(q);
    const through = IN.qualifiedNations(q);
    assert(through && through.length === t.teams, t.name + ': qualifying fills the field',
      (through ? through.length : 0) + '/' + t.teams);
    assert(new Set(through).size === through.length, t.name + ': nobody qualifies twice');

    if (t.id === 'worldcup') {
      const byConfed = {};
      through.forEach(n => { const c = NT.confedOf(n); byConfed[c] = (byConfed[c] || 0) + 1; });
      log('  World Cup field: ' + Object.keys(byConfed).sort()
        .map(k => k + ' ' + byConfed[k]).join(', '), 'dim');
      // Qualifying has to be capable of eliminating a strong nation, or it
      // is just an expensive way of seeding on strength.
      const top8 = NT.ranked().slice(0, 8).map(n => n.name);
      const missing = top8.filter(n => through.indexOf(n) < 0);
      log('  strong nations who missed out: ' + (missing.join(', ') || 'none'), 'dim');
    }
  });
});
FCM.G.state = null;

// ----------------------------------------------------------- man management
h2('15. Man management');
const MM = FCM.MM;
const mmClub = DB.clubs.find(c => c.name === 'Liverpool');
const mmState = { day: 100, season: 2025, board: { confidence: 70 } };
const mmSquad = FCM.DB.squadOf(mmClub);

// A promise you never honour must actually cost you.
const broken = mmSquad[3];
broken.minutes = 0; broken.morale = 70; broken.promise = null; broken.trustBroken = 0;
MM.promise(broken, 'gametime', mmState);
assert(!!broken.promise, 'a promise is recorded');
const afterPromise = broken.morale;
assert(afterPromise > 70, 'making a promise lifts him', afterPromise);
const midState = { day: 100 + 7 * 13, season: 2025, board: { confidence: 70 } };
assert(MM.judgePromise(broken, mmClub, midState) === 'broken',
  'never playing him breaks the promise');
MM.reviewPromises(mmClub, midState);
assert(broken.morale < afterPromise - 20, 'breaking your word craters his morale',
  Math.round(afterPromise) + ' -> ' + Math.round(broken.morale));
assert(broken.trustBroken === 1, 'he remembers it');

// And one you do honour.
const kept = mmSquad[4];
kept.minutes = 0; kept.morale = 70; kept.promise = null; kept.trustBroken = 0;
MM.promise(kept, 'gametime', mmState);
kept.minutes = 90 * 12;   // played every week of the window
assert(MM.judgePromise(kept, mmClub, midState) === 'kept',
  'playing him regularly keeps the promise');

// A second broken promise pushes him out the door.
broken.promise = null;
MM.promise(broken, 'gametime', midState);
broken.minutes = 0;
const lateState = { day: midState.day + 7 * 13, season: 2025, board: { confidence: 70 } };
MM.reviewPromises(mmClub, lateState);
assert(broken.trustBroken >= 2 && broken.transferRequested,
  'break your word twice and he asks to leave', 'trustBroken=' + broken.trustBroken);

// Conversations are a read, not a free morale button.
const chatRng = new FCM.RNG(5);
const inForm = mmSquad[6];
inForm.form = 7.5; inForm.morale = 65; inForm.lastChatDay = null;
const praised = MM.chat(inForm, 'praise', chatRng, mmState);
assert(praised.good && praised.delta > 0, 'praising a player in form lifts him',
  praised.delta);
const alsoInForm = mmSquad[7];
alsoInForm.form = 7.5; alsoInForm.morale = 65; alsoInForm.lastChatDay = null;
const nagged = MM.chat(alsoInForm, 'criticise', chatRng, mmState);
assert(!nagged.good && nagged.delta < 0, 'criticising a player in form backfires',
  nagged.delta);
assert(!MM.canChat(inForm, mmState), 'you cannot talk to him again immediately');
assert(MM.canChat(inForm, { day: mmState.day + 20 }), 'a fortnight later you can');

// Influence: a senior star must carry more weight than a squad player.
const room = MM.dressingRoom(mmClub);
const best = U.sortBy(mmSquad, p => p.ovr, true)[0];
const worst = U.sortBy(mmSquad, p => p.ovr, false)[0];
assert(MM.influence(best) > MM.influence(worst),
  'the best player carries more weight in the room',
  MM.influence(best) + ' vs ' + MM.influence(worst));
assert(room.length === mmSquad.length, 'every player is placed in the room');

h2(fails === 0 ? 'ALL TESTS PASSED' : fails + ' TEST(S) FAILED');
document.title = fails === 0 ? 'PASS' : 'FAIL(' + fails + ')';

} catch (err) {
  fails++;
  log('EXCEPTION: ' + err.message, 'bad');
  log(err.stack, 'dim');
  document.title = 'ERROR';
}
</script>
